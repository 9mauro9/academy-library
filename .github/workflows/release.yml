name: "OS 2.2 — Automated SemVer Release (release-please)"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Generate SemVer Tag & CHANGELOG"
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: "Run release-please"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Post Release Summary"
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.release.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Created | \`${{ steps.release.outputs.release_created }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: "Conditional Production Deployment"
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Install Firebase CLI"
        run: npm install -g firebase-tools

      - name: "Run Pre-Deploy Integration Tests"
        run: |
          firebase emulators:exec --only firestore,functions 'npm test' \
            --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: "Deploy to Firebase Hosting & Functions"
        run: |
          firebase deploy --only hosting,functions \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --message "Release ${{ needs.release-please.outputs.tag_name }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: "Post Deployment Summary"
        if: always()
        run: |
          echo "## 🌐 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.release-please.outputs.tag_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Project | \`${{ secrets.FIREBASE_PROJECT_ID }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
