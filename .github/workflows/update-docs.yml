name: "OS 2.2 — Living Blueprint Sync (The Librarian)"

on:
  push:
    branches:
      - main
    paths:
      - "docs/data-model.md"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "src/**"
      - "functions/src/**"

jobs:
  librarian-sync:
    name: "The Librarian — Sync ARCHITECTURE.md Mermaid Diagrams"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Schema & Rules Consistency Sync Check"
        id: sync-check
        run: |
          npm run sync-docs 2>&1 | tee sync-output.txt
          echo "## 📐 Schema Sync Check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sync-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Invoke Librarian — Regenerate Mermaid Diagrams"
        id: librarian
        env:
          LIBRARIAN_TRIGGER: "merge-to-main"
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # The Librarian agent routine:
          # Reads docs/data-model.md and source topology, rewrites ARCHITECTURE.md Mermaid blocks.
          # This step is fulfilled by the Antigravity Librarian subagent in agentic workflows.
          # In CI, it runs the npm sync-docs script which handles Mermaid regeneration.
          echo "Librarian triggered by commit: $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Trigger message: $COMMIT_MSG" >> $GITHUB_STEP_SUMMARY

          if npm run generate-architecture-diagrams 2>/dev/null; then
            echo "✅ Mermaid diagrams regenerated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ generate-architecture-diagrams script not configured — sync-docs ran instead" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Commit Updated ARCHITECTURE.md (if changed)"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(architecture): auto-sync Mermaid diagrams via The Librarian [skip ci]

Co-authored-by: TheLibrarian <agent@antigravity.internal>"
          file_pattern: "ARCHITECTURE.md docs/*.md"
          commit_author: "The Librarian <agent@antigravity.internal>"

      - name: "Post Living Blueprint Summary"
        if: always()
        run: |
          echo "## 📚 Living Blueprint Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | Push to \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | The Librarian (OS 2.2) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
